[project]
name = "attendance-teams-bot"
version = "0.1.0"
description = "Microsoft Teams-facing MCP client for Attendance CRMT"
readme = "README.md"
authors = [
    { name = "Joselu", email = "joseluiscc103@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
attendance-teams-bot = "attendance_teams_bot.cli:main"
attendance-teams-bot-http = "attendance_teams_bot.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
strict = true
