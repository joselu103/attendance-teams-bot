services:
  attendance-teams-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BOT_IMAGE:-attendance-teams-bot:dev}
    ports:
      - "${BOT_PUBLISH_BIND:-127.0.0.1}:${BOT_PORT:-8080}:8080"
    environment:
      LOG_ENV: ${LOG_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      BOT_RUNTIME_MODE: ${BOT_RUNTIME_MODE:-local}
      ATTENDANCE_INTEGRATION_ENABLED: ${ATTENDANCE_INTEGRATION_ENABLED:-false}
      MCP_ENDPOINT: ${MCP_ENDPOINT:-}
      MCP_SCOPE: ${MCP_SCOPE:-}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-10}
      TEAMS_SSO_OAUTH_CONNECTION_NAME: ${TEAMS_SSO_OAUTH_CONNECTION_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ATTENDANCE_HISTORY_SIGNING_KEY: ${ATTENDANCE_HISTORY_SIGNING_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID: ${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID: ${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET: ${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET:-}
    restart: unless-stopped
