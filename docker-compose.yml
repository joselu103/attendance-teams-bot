services:
  attendance-teams-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BOT_IMAGE:-attendance-teams-bot:dev}
    ports:
      - "${BOT_PUBLISH_BIND:-127.0.0.1}:${BOT_PORT:-8080}:8080"
    environment:
      LOG_ENV: ${LOG_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      BOT_RUNTIME_MODE: ${BOT_RUNTIME_MODE:-local}
      MCP_ENDPOINT: ${MCP_ENDPOINT:-}
      ATTENDANCE_API_DELEGATED_SCOPE: ${ATTENDANCE_API_DELEGATED_SCOPE:-}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-10}
      TEAMS_SSO_OAUTH_CONNECTION_NAME: ${TEAMS_SSO_OAUTH_CONNECTION_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      BOT_APP_ID: ${BOT_APP_ID:-}
      BOT_TENANT_ID: ${BOT_TENANT_ID:-}
      BOT_CLIENT_SECRET: ${BOT_CLIENT_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendance_memory
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance_memory}
      POSTGRES_USER: ${POSTGRES_USER:-attendance_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - attendance_memory

volumes:
  postgres_data:

networks:
  attendance_memory:
